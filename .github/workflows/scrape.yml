name: Denný scrape trhových cien

# Mac-nezávislý zber inzercie 2× denne: beží na GitHub runneri, commitne JSON do tohto repa a pošle ho po krokoch
# do appky (/api/ingest-market → D1). Stav (listings.db) drží actions/cache, cold-start seed = state/listings.db.gz.
#
#   RANNÝ beh (rolling)        — celé portály: kraj denne + obmena katalógu SR + re-verify Bazoša (~2–2,5 h),
#                                hotový pred ranným súhrnom o 7:30 (súhrn posiela appka/Mac, nie tento workflow)
#   POPOLUDŇAJŠÍ beh (newest)  — oprava 10 (2026-11-28): LEN NOVÉ inzeráty (Bazoš najnovšie strany, kraj na
#                                reality.sk = nehnutelnosti.sk a topreality od najnovších), ~5–15 min, nič neposiela
#
# Ktorý beh sa spustí, rozhoduje krok „Už dnes prebehlo?" (health.py plan) podľa AKTUÁLNYCH reportov v repe:
# kým dnes nie je ranný zber v appke, každý termín spustí ranný; potom 12–21 h (miestny čas) a aspoň 3 h po
# poslednom zbere jeden popoludňajší. GitHub plánované behy mešká o hodiny a niektoré vynechá — preto viac termínov.

on:
  schedule:
    - cron: "30 2 * * *"     # 02:30 UTC — ranný zber (zber s celým Žilinským krajom trvá ~2,5 h)
    - cron: "30 10 * * *"    # 10:30 UTC — záloha ranného
    - cron: "0 13 * * *"     # 13:00 UTC = 14:00 SEČ / 15:00 SELČ — popoludňajší ľahký beh (len nové inzeráty)
    - cron: "0 16 * * *"     # 16:00 UTC — záloha (ranný, ak ešte nebol; inak popoludňajší, ak ešte nebol)
  workflow_dispatch:          # ručné spustenie: Actions → Denný scrape → Run workflow
    inputs:
      mode:
        description: "auto = podľa stavu dňa · rolling = ranný (celý) · newest = popoludňajší (len nové)"
        type: choice
        options: [auto, rolling, newest]
        default: auto
  push:                       # zmena kódu zberu = okamžitý overovací beh (dátové commity bota ho nespúšťajú)
    branches: [main]
    paths: ["scraper.py", "portals.py", "price_trends.py", "health.py", "ingest.py", "repo_push.py", "polite.py",
            "pii.py", ".github/workflows/scrape.yml"]

permissions:
  contents: write

# Ranný aj popoludňajší beh sú v TOM ISTOM workflowe a skupine → nikdy nebežia naraz (ďalší čaká vo fronte;
# keď medzitým príde ďalší termín, čakajúci sa zruší — nevadí, každý beh si o režime rozhodne až pri štarte).
concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Repo je VEREJNÉ → štandardný GitHub-hosted runner je zadarmo bez limitu minút; max. dĺžka jobu je 6 h.
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v4

      - name: Už dnes prebehlo? (ranný / popoludňajší beh)
        id: guard
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          FORCED: ${{ github.event.inputs.mode }}
        run: |
          # report čítam z AKTUÁLNEHO origin/main — checkout čakajúceho behu môže byť hodiny starý (28. 11.)
          git fetch -q --depth=1 origin main
          python3 health.py plan

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.mode != 'skip'
        with:
          python-version: "3.12"

      # restore + save ZVLÁŠŤ: actions/cache@v4 ukladá len pri úspešnom jobe, takže keď 8. 10.–7. 11. padal
      # krok ingestu, každý deň sa zahodil celý zber a ďalší beh začal znova od stavu zo 7. 10.
      - name: Restore listings.db (cache)
        if: steps.guard.outputs.mode != 'skip'
        uses: actions/cache/restore@v4
        with:
          path: listings.db
          key: listings-db-${{ github.run_id }}
          restore-keys: |
            listings-db-

      - name: Seed DB ak nie je cache
        if: steps.guard.outputs.mode != 'skip'
        run: |
          if [ ! -f listings.db ]; then
            echo "cache miss → seed z state/listings.db.gz"
            gunzip -c state/listings.db.gz > listings.db
          else
            echo "listings.db z cache ($(du -h listings.db | cut -f1))"
          fi

      - name: Zber (ranný = rolling, popoludňajší = len nové)
        id: scrape
        if: steps.guard.outputs.mode != 'skip'
        env:
          MODE: ${{ steps.guard.outputs.mode }}
          # ranný: časový strop zberu 135 min (kraj sa zbiera PRVÝ na každom portáli, strop zastaví len celoštátnu
          # obmenu), re-verify Bazoša max. 300 inzerátov / +10 min, geokód obcí max. +8 min — zvyšok limitu jobu
          # (210 min) ostane na zápis a ingest. Popoludňajší: 15 min, bez re-verify, geokód max. 60 obcí.
          SCRAPE_BUDGET_MIN: ${{ steps.guard.outputs.mode == 'rolling' && '135' || '15' }}
          REVERIFY_CAP: ${{ steps.guard.outputs.mode == 'rolling' && '300' || '0' }}
          REVERIFY_BUDGET_MIN: "10"
          GEOCODE_BUDGET: ${{ steps.guard.outputs.mode == 'rolling' && '400' || '60' }}
        run: |
          if [ "$MODE" = "rolling" ]; then
            rm -f market-data.json market-listings-*.json market-pricehistory-*.json market-trends.json
          else
            rm -f market-data.json market-listings-*.json   # história cien a trendy z rána ostávajú
          fi
          python3 scraper.py --mode "$MODE"

      - name: Save listings.db (aj keď neskorší krok zlyhá)
        if: always() && steps.guard.outputs.mode != 'skip' && hashFiles('listings.db') != ''
        uses: actions/cache/save@v4
        with:
          path: listings.db
          key: listings-db-${{ github.run_id }}

      - name: Zápis výstupov do repa (bez konfliktov, nad aktuálnym main)
        id: commit
        if: steps.guard.outputs.mode != 'skip'
        env:
          MODE: ${{ steps.guard.outputs.mode }}
        run: |
          if [ "$MODE" = "rolling" ]; then
            python3 repo_push.py -m "data $(date -u +%F)" market-data.json 'market-listings-*.json' \
              'market-pricehistory-*.json' market-trends.json scrape-report.json
          else
            python3 repo_push.py -m "data $(date -u +%F) popoludnie (len nové)" market-data.json \
              'market-listings-*.json' scrape-report-newest.json
          fi

      - name: Ingest do appky (D1) — po krokoch, pripnuté na commit, s opakovaním
        id: ingest
        if: steps.guard.outputs.mode != 'skip'
        env:
          SECRET: ${{ secrets.ALERT_SECRET }}
          REF: ${{ steps.commit.outputs.sha }}
          INGEST_BUDGET_MIN: "30"
        run: python3 ingest.py --ref "$REF"

      - name: Stav zberu + značka „v appke" (Telegram len pri probléme ranného behu)
        id: report
        if: steps.guard.outputs.mode != 'skip'
        env:
          MODE: ${{ steps.guard.outputs.mode }}
          EVENT: ${{ github.event_name }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          f=scrape-report.json; [ "$MODE" = "newest" ] && f=scrape-report-newest.json
          python3 health.py mark-ingested --mode "$MODE"
          python3 health.py report --mode "$MODE"
          python3 repo_push.py -m "report $(date -u +%F)$([ "$MODE" = newest ] && echo ' popoludnie')" "$f"

      - name: Upozornenie vlastníkovi pri zlyhaní (hneď)
        if: failure()
        env:
          ALERT_SECRET: ${{ secrets.ALERT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STAGE_SCRAPE: ${{ steps.scrape.outcome }}
          STAGE_COMMIT: ${{ steps.commit.outcome }}
          STAGE_INGEST: ${{ steps.ingest.outcome }}
          STAGE_REPORT: ${{ steps.report.outcome }}
        run: python3 health.py fail "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" --mode "${{ steps.guard.outputs.mode || 'rolling' }}"
