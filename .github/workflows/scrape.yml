name: Denný scrape trhových cien

# Mac-nezávislý scrape: beží na GitHub runneri, commitne JSON do tohto repa,
# a curlne /api/ingest-market na appke → D1. Stav (listings.db) drží actions/cache,
# cold-start seed = state/listings.db.gz (jednorazovo commitnutý, história first_price/drops/geokód).

on:
  # TRI termíny: GitHub plánované behy mešká o hodiny a pri záťaži ich občas vynechá. Prvý úspešný
  # zber dňa sa ráta, ďalšie termíny sa za pár sekúnd preskočia (krok „Už dnes prebehlo?").
  schedule:
    - cron: "0 5 * * *"      # 05:00 UTC
    - cron: "30 10 * * *"    # 10:30 UTC — záloha
    - cron: "0 16 * * *"     # 16:00 UTC — záloha
  workflow_dispatch: {}       # manuálne spustenie
  push:                       # zmena kódu scrapera = okamžitý overovací beh (dátové commity bota ho nespúšťajú)
    branches: [main]
    paths: ["scraper.py", "portals.py", "price_trends.py", "health.py", ".github/workflows/scrape.yml"]

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # rolling (1/7 katalógu Bazoš + reality + nehnutelnosti + topreality + zoznamrealit) ≈ 60–90 min
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Už dnes prebehlo?
        id: guard
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(python3 health.py done-today)" = "yes" ]; then
            echo "Dnešný zber už prebehol a je v appke — tento termín preskakujem."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.12"

      # restore + save ZVLÁŠŤ: actions/cache@v4 ukladá len pri úspešnom jobe, takže keď 8. 10.–7. 11. padal
      # krok ingestu, každý deň sa zahodil celý zber a ďalší beh začal znova od stavu zo 7. 10.
      - name: Restore listings.db (cache)
        if: steps.guard.outputs.skip != 'true'
        uses: actions/cache/restore@v4
        with:
          path: listings.db
          key: listings-db-${{ github.run_id }}
          restore-keys: |
            listings-db-

      - name: Seed DB ak nie je cache
        if: steps.guard.outputs.skip != 'true'
        run: |
          if [ ! -f listings.db ]; then
            echo "cache miss → seed z state/listings.db.gz"
            gunzip -c state/listings.db.gz > listings.db
          else
            echo "listings.db z cache ($(du -h listings.db | cut -f1))"
          fi

      - name: Scrape (rolling — týždenná obmena celého katalógu + re-verify)
        id: scrape
        if: steps.guard.outputs.skip != 'true'
        env:
          REVERIFY_CAP: "800"
          GEOCODE_BUDGET: "400"
          # časový strop zberu: po 95 min sa ďalšie stránky nesťahujú (zvyšok obmeny v ďalšom behu), re-verify
          # max. +10 min, geokód obcí max. +8 min — zvyšok limitu jobu (150 min) ostane na uloženie, commit a ingest
          # do appky. Odhad po 2026-11-11 (Bazoš krok 40, reality.sk bez detailov): zber ≈ 75–85 min.
          SCRAPE_BUDGET_MIN: "95"
          REVERIFY_BUDGET_MIN: "10"
        run: |
          rm -f market-listings-*.json market-pricehistory-*.json   # staré chunky (napr. z 20. 9.) nesmú ostať v repe
          python3 scraper.py --mode rolling

      - name: Save listings.db (aj keď neskorší krok zlyhá)
        if: always() && steps.guard.outputs.skip != 'true' && hashFiles('listings.db') != ''
        uses: actions/cache/save@v4
        with:
          path: listings.db
          key: listings-db-${{ github.run_id }}

      - name: Commit JSON výstupy
        id: commit
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "trilipy-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A -- 'market-*.json' scrape-report.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "data $(date -u +%F)"
            for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 15; done
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Ingest do D1 (appka) — stepovo, pripnuté na commit, s opakovaním
        # Každý krok je samostatný bounded request (limit Workera ~1000 subrequestov). Súbory sa čítajú
        # z práve publikovaného commitu (ref), nie z „main" (cache raw GitHubu). Prechodná chyba
        # (5xx/timeout) sa skúsi 4× s narastajúcim čakaním — dovtedy jeden výpadok zhodil celý ingest.
        if: steps.guard.outputs.skip != 'true'
        env:
          SECRET: ${{ secrets.ALERT_SECRET }}
          APP: https://trilipy-kataster.kristiak-bohus.workers.dev
          REF: ${{ steps.commit.outputs.sha }}
        run: |
          set -uo pipefail
          post() {
            body=$(python3 -c "import json,sys; d=json.loads(sys.argv[1]); d['ref']=sys.argv[2]; print(json.dumps(d))" "$1" "$REF")
            for a in 1 2 3 4; do
              code=$(curl -sS --max-time 150 -o /tmp/ing.json -w "%{http_code}" -X POST \
                "$APP/api/ingest-market" -H "x-alert-secret: $SECRET" \
                -H "content-type: application/json" -d "$body" || echo 000)
              echo "  $1 (pokus $a) -> HTTP $code"; head -c 400 /tmp/ing.json 2>/dev/null; echo
              [ "$code" = "200" ] && return 0
              [ "$code" = "401" ] && return 1          # zlý secret — opakovanie nepomôže
              sleep $((20 * a))
            done
            return 1
          }
          post '{"step":"data"}' || exit 1
          chunks=$(python3 -c "import json;print(int(json.load(open('/tmp/ing.json')).get('chunks') or 0))")
          ph=$(python3 -c "import json;print(int(json.load(open('/tmp/ing.json')).get('phChunks') or 0))")
          echo "listings chunkov=$chunks, pricehistory chunkov=$ph"
          i=0; while [ "$i" -lt "$chunks" ]; do post "{\"step\":\"listings\",\"chunk\":$i}" || exit 1; i=$((i+1)); done
          i=0; while [ "$i" -lt "$ph" ]; do post "{\"step\":\"pricehistory\",\"chunk\":$i}" || exit 1; i=$((i+1)); done
          post '{"step":"compute"}' || exit 1

      - name: Stav zberu (Telegram len pri probléme) + značka „v appke"
        if: steps.guard.outputs.skip != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 -c "import json; p='scrape-report.json'; r=json.load(open(p)); r['ingested']=True; json.dump(r, open(p,'w'), ensure_ascii=False, indent=1)"
          python3 health.py report
          git add scrape-report.json
          if ! git diff --cached --quiet; then
            git commit -m "report $(date -u +%F)"
            for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 15; done
          fi

      - name: Hlásenie zlyhania do Telegramu
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 health.py fail "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
